{% extends "admin/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<form class="card narrow" method="post" autocomplete="on">
  <h1>Sign in</h1>
  <p class="muted">{{ site.store_name }} dashboard</p>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username <input name="username" required maxlength="80" autocomplete="username" autofocus></label>
  <label>Password <input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
  <button class="btn" type="submit">Sign in</button>
</form>
{% endblock %}
